<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedLink | Donor Registration</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; padding: 50px; }
        .form-card { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        input, select, button { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { background-color: #2ecc71; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #27ae60; }
    </style>
</head>
<body>
    <div class="form-card">
        <h2>Become a Blood Donor</h2>
        
        <form id="donorForm">
            <label>Full Name</label>
            <input type="text" id="name" required placeholder="Enter your name">

            <label>Blood Group</label>
            <select id="blood_group" required>
                <option value="">Select Group</option>
                <option value="A+">A+</option>
                <option value="O+">O+</option>
                <option value="B+">B+</option>
                <option value="AB+">AB+</option>
                <option value="A-">A-</option>
                <option value="O-">O-</option>
            </select>

            <label>Phone Number</label>
            <input type="tel" id="phone_number" required placeholder="10-digit mobile number">

            <button type="submit">Register Now</button>
        </form>
        <p style="text-align: center; margin-top: 15px;"><a href="/">Back to Home</a></p>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
