<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedLink | Healthcare Connectivity</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; background-color: #f4f7f6; }
        .container { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); max-width: 600px; margin: auto; }
        h1 { color: #2c3e50; }
        .btn { display: inline-block; padding: 10px 20px; margin: 10px; background-color: #3498db; color: white; text-decoration: none; border-radius: 5px; }
        .btn:hover { background-color: #2980b9; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to MedLink</h1>
        <p>Connecting patients and blood donors seamlessly across Ranchi.</p>
        <a href="/donor" class="btn">Register as a Donor</a>
        <a href="/patient" class="btn" style="background-color: #e74c3c;">Register as a Patient</a>
    </div>
</body>
<div class="status-check-section">
    <h3>Check Your Registration Status</h3>
    <input type="text" id="search_phone" placeholder="Enter your phone number">
    <button onclick="checkMyStatus()">Check Status</button>
    
    <p id="status_result_message"></p>
</div>
</html>
