<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedLink | Patient Registration</title>
    <style>
        /* General Page Styling */
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f4f7f6; 
            display: flex; 
            justify-content: center; 
            padding: 50px; 
            margin: 0;
        }
        
        /* The White Form Container */
        .form-card { 
            background: white; 
            padding: 30px; 
            border-radius: 10px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 450px; 
        }

        h2 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 25px;
            margin-top: 0;
        }
        
        /* THE FIX: Forces labels to sit on their own line above the input */
        label { 
            display: block; 
            font-weight: bold; 
            margin-top: 15px; 
            margin-bottom: 5px;
            color: #34495e; 
            font-size: 0.9em;
        }
        
        /* Input Field Styling */
        input, select, textarea { 
            width: 100%; 
            padding: 10px; 
            border: 1px solid #bdc3c7; 
            border-radius: 5px; 
            box-sizing: border-box; 
            font-size: 1em;
        }

        /* Input Focus Effect (glows blue when clicked) */
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 5px rgba(52, 152, 219, 0.3);
        }
        
        /* Submit Button Styling */
        button { 
            width: 100%;
            background-color: #e74c3c; 
            color: white; 
            border: none; 
            font-weight: bold; 
            cursor: pointer; 
            padding: 12px; 
            margin-top: 25px;
            border-radius: 5px;
            font-size: 1.1em;
            transition: background-color 0.2s;
        }
        
        button:hover { 
            background-color: #c0392b; 
        }

        /* Back to Home Link */
        .back-link {
            text-align: center; 
            margin-top: 20px;
            font-size: 0.9em;
        }

        .back-link a {
            color: #3498db;
            text-decoration: none;
        }

        .back-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="form-card">
        <h2>Patient Registration</h2>
        
        <form id="patientForm">
            <label for="patient_name">Full Name</label>
            <input type="text" id="patient_name" required placeholder="Enter patient name">

            <label for="patient_age">Age</label>
            <input type="number" id="patient_age" required placeholder="Enter age" min="1" max="120">

            <label for="patient_blood_group">Required Blood Group</label>
            <select id="patient_blood_group" required>
                <option value="">Select Group</option>
                <option value="A+">A+</option>
                <option value="O+">O+</option>
                <option value="B+">B+</option>
                <option value="AB+">AB+</option>
                <option value="A-">A-</option>
                <option value="O-">O-</option>
            </select>

            <label for="patient_phone">Phone Number</label>
            <input type="tel" id="patient_phone" required placeholder="10-digit mobile number" pattern="[0-9]{10}">

            <label for="patient_symptoms">Symptoms/Reason (Optional)</label>
            <textarea id="patient_symptoms" rows="3" placeholder="Briefly describe the emergency or symptoms"></textarea>

            <button type="submit">Request Blood</button>
        </form>
        
        <div class="back-link">
            <a href="/">← Back to Home</a>
        </div>
    </div>

    <!-- Link to our JavaScript logic -->
    <script src="/static/script.js"></script>
</body>
</html>
